<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>خريطة المعلم المبتدئ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: خريطة مفاهيم في صفحة واحدة؛ صف مشكلات أعلى، قلب الخريطة في الوسط، صف مشكلات أسفل، وخطوط تصل كل مشكلة بالقلب الذي تتفتح فيه فروعها */
:root{
  --paper:#F3F6F9; --card:#FFFFFF; --ink:#1F2B45; --soft:#5A6782; --line:#C9D3DF; --grid:#E4EAF0; --tint:#F1F4F8; --gold:#C9A25A;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --mixc:var(--c);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1A2A; --card:#162438; --ink:#E1E9F3; --soft:#A2B3C9; --line:#34496A; --grid:#17263B; --tint:#1C2D45; --gold:#D9B26A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1A2A; --card:#162438; --ink:#E1E9F3; --soft:#A2B3C9; --line:#34496A; --grid:#17263B; --tint:#1C2D45; --gold:#D9B26A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);direction:rtl;font-size:16px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.35;text-wrap:balance}

.board{background:#1F2B45;color:#fff;border-radius:10px;border-bottom:6px solid var(--gold);padding:14px 18px;text-align:center;margin-bottom:22px}
.board h1{font-size:clamp(1.4rem,5vw,2rem);font-weight:700}
.board p{margin:2px 0 0;font-size:.92rem;opacity:.85}

.map{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 14px}
@media (min-width:760px){.map{grid-template-columns:repeat(4,minmax(0,1fr));gap:56px 18px}}
.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.links line{stroke-width:3;stroke-linecap:round;transition:opacity .3s,stroke-width .3s}
.links.focus line{opacity:.18}
.links.focus line.on{opacity:1;stroke-width:5}

.node{position:relative;z-index:1;font:inherit;text-align:right;color:var(--ink);background:var(--card);border:2.5px solid var(--c);border-radius:14px;padding:12px 12px 10px;
  display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:118px;transition:transform .2s,box-shadow .2s}
.node.miss{border-style:dashed}
.node:hover{transform:translateY(-2px)}
.node:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.node.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent);transform:translateY(-2px)}
.nnum{position:absolute;top:-14px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:700;font-size:.95rem;display:grid;place-items:center;border:3px solid var(--paper)}
.nname{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.35;color:var(--tc);padding-right:10px}
.nplace{font-size:.78rem;color:var(--soft);line-height:1.5}
.ninside{margin-top:auto;font-size:.74rem;font-weight:600;background:var(--tint);border-radius:999px;padding:1px 9px;align-self:flex-start}

.heart{grid-column:1/-1;position:relative;z-index:2;background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:18px;min-height:150px}
.heart.idle{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;max-width:420px;justify-self:center;width:100%}
.heart .small{font-family:var(--f-display);font-weight:500;font-size:.82rem;color:var(--soft)}
.heart .title{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,5vw,1.9rem)}
.heart .cta{font-size:.88rem;color:var(--soft);margin-top:4px}
.heart.open{border-color:var(--c);box-shadow:0 6px 0 var(--c)}

.hhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hnum{width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:700;font-size:1.3rem;display:grid;place-items:center;flex:none}
.hname{flex:1 1 200px;min-width:0}
.hname h2{font-size:clamp(1.25rem,4.5vw,1.6rem);color:var(--tc)}
.hname span{font-size:.85rem;color:var(--soft)}
.hbtns{display:flex;gap:6px}
.ib{font:inherit;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.ib svg{width:18px;height:18px}
.ib:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.tree{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.v{width:3px;height:22px;background:var(--c);flex:none}
.v.dash{width:0;background:none;border-right:3px dashed var(--c)}
.box{width:100%;background:var(--card);border:2px solid var(--c);border-radius:14px;padding:12px 16px}
.box p{margin:0}
.box ol{margin:0;padding-right:1.4em;list-style:arabic-indic;display:grid;gap:4px}
.tag{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:.8rem;color:#fff;background:var(--c);border-radius:999px;padding:0 12px;margin-bottom:4px}
.hub{font-family:var(--f-display);font-weight:600;color:var(--tc);background:var(--card);border:2.5px solid var(--c);border-radius:999px;padding:4px 20px}
.hub.dash{border-style:dashed}
.leaves{display:grid;gap:12px;width:100%;margin-top:0}
@media (min-width:640px){.leaves.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.leaves.n3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.leaf{background:var(--card);border:2px solid var(--c);border-radius:14px;padding:10px 14px;font-size:.95rem;min-width:0}
.leaf b{display:block;font-family:var(--f-display);font-weight:600;color:var(--tc);margin-bottom:2px}
.split{display:grid;gap:14px;width:100%}
@media (min-width:640px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}}
.col{display:flex;flex-direction:column;align-items:center;min-width:0}
.stack{display:grid;gap:10px;width:100%}
.write{width:100%;border:2.5px dashed var(--c);border-radius:14px;padding:12px 14px;background:var(--card)}
.write p{margin:0 0 6px;font-size:.9rem;color:var(--soft)}
textarea{width:100%;min-height:90px;font:inherit;font-size:16px;color:var(--ink);background:var(--tint);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
textarea:focus{outline:2px solid var(--c);border-color:var(--c)}
.row{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.btn{font:inherit;font-family:var(--f-display);font-weight:600;font-size:.88rem;border-radius:999px;padding:6px 16px;cursor:pointer;border:none;background:var(--c);color:#fff}
.ok{font-size:.85rem;font-family:var(--f-display);font-weight:600;color:var(--tc)}
.key{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;font-size:.82rem;color:var(--soft);margin-top:26px}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{width:20px;height:12px;border:2px solid var(--soft);border-radius:4px;display:inline-block}
.sw.d{border-style:dashed}
@media (prefers-reduced-motion:no-preference){.heart.open{animation:pop .35s ease-out}@keyframes pop{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:none}}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .node,:root:not([data-theme="light"]) .heart{--tc:color-mix(in srgb,var(--c) 55%,white)}}
:root[data-theme="dark"] .node,:root[data-theme="dark"] .heart{--tc:color-mix(in srgb,var(--c) 55%,white)}
</style>
</head>
<body>


<div class="wrap">
  <div class="board">
    <h1>خريطة مفاهيم</h1>
    <p>اضغطي على أي مشكلة لتتفتح فروعها في قلب الخريطة</p>
  </div>
  <div class="map" id="map">
    <svg class="links" id="links" aria-hidden="true"></svg>
  </div>
</div>

<script>
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["#2E6A8E","#6E55A0","#2B7A70","#B9533D","#A9761F","#4E7A36","#94446C","#3A5797"];

const P = [
  {name:"المواجهة الأولى", place:"باب الفصل",
   d:"أول مرة يدخل الطالب المعلم إلى غرفة الصف ليواجه الطلاب ويقوم بالتدريس، ويسبقها شعور بالأرق وعدم النوم في الليلة التي تسبق الذهاب للتدريب.",
   tt:"نصائح العلاج", tips:[
     ["الزيارات المسبقة","محاولة زيارة بعض المعلمين ومشاهدة دروسهم لفترة أسبوعين على الأقل قبل بدء المواجهة المنفردة."],
     ["المشاركة في فريق","الاشتراك مع أحد المعلمين في فريق للتدريس لمدة لا تقل عن أسبوعين، بحيث لا تتضمن أكثر من ٣ إلى ٤ دقائق من العمل الفعلي في البداية."]]},
  {name:"الشعور بالغربة", place:"الكرسي الوحيد في الزاوية",
   d:"شعور المعلم في الأسابيع الأولى من تدريسه في المدرسة بالغربة، لعدم معرفته بمكونات المكان أو بأسماء الأشخاص وطبائعهم.",
   tt:"نصائح العلاج", tips:[
     ["التعرف على معلم من التخصص","محاولة التعرف بأسرع ما يمكن على واحد على الأقل من معلمي مادة تخصصك، للاستفادة منه في تنظيم جدولك أو شرح بعض الأمور لك أو حضور بعض الدروس معه. وسيؤدي ذلك إلى وجود شخص تألفه وتتحدث معه، وهو بدوره سيتبنى تقديمك لبقية زملائه، فتنتهي مشكلة غربتك بسرعة."],
     ["الانضمام إلى جماعات النشاط","سرعة البحث عن جماعات النشاط التي توافق ميولك في المدرسة، وبحث إمكانية مشاركتك في تنظيم هذا النشاط والمعاونة في الإشراف عليه."]]},
  {name:"الفجوة بين النظرية والتطبيق", place:"السبورة",
   d:"التفاوت الكبير بين ما يسمعه الطالب المعلم في الكلية من نظريات تربوية مثالية، وما يجده مطبقًا في المدرسة من أساليب تقليدية غير تربوية."},
  {name:"انصراف الطلاب عن الدرس", place:"طاولات الطالبات",
   d:"انصراف الطلاب عن الدرس والاشتراك معًا في محادثات جانبية بسبب فقدان الدافعية للانتباه.",
   causes:["قلة خبرة الطالب المعلم وعدم تمكنه من أساليب الإثارة والتشويق وجذب الانتباه.","فقدان اهتمام الطلاب بالدرس.","انعدام الدافعية للتعلم لدى الطلاب."],
   tt:"العلاج", tips:[
     ["التدريب على مهارة الإثارة","ضرورة التدريب على مهارة الإثارة واستخدام المواد والأجهزة التعليمية لتحقيق ذلك."],
     ["جعل المتعلم محور التعلم","تخلي الطالب المعلم عن الفكر الدوجماتي واستبداله بفكر جديد يجعل الطالب المتعلم محورًا للعملية التعليمية، ويحرر طاقاته وفكره مشغلًا إياها في التعلم."],
     ["التدرج في مهام التدريس","التدرج في تولي مهام التدريس، بحيث يتولى الطالب المعلم التقديم للدرس فقط لبضع دقائق عندما يعمل في فريق، ويكمل أعضاء الفريق مهام التدريس."]]},
  {name:"الأسئلة الحرجة", place:"يد مرفوعة بين الطالبات",
   d:"الأسئلة البسيطة التي تتصل بمهام المعلم في الموقف التدريسي، مثل السؤال عن غياب الطلاب أو باب الصف، ويُقصد بها إرباكه وكشف مدى قدرته على الإجابة.",
   tt:"نصائح لتجنبها", tips:[
     ["إعادة توجيه السؤال","استقبال السؤال وإعادة توجيهه إلى جميع طلاب الفصل لحثهم على التفكير."],
     ["الاعتذار وتأجيل الإجابة","الاعتذار للطالب السائل ووعده بأن الوقت ضيق، ومن الممكن مروره على المدرس عقب الدرس."],
     ["تحويل السؤال إلى بحث","تحويل السؤال إلى بحث يجربه الطالب بمفرده أو مع مجموعة من الزملاء."]]},
  {name:"إنهاء روتينيات التدريس", place:"كشف الغياب على المكتب",
   d:"ارتباك المعلم المبتدئ عند إنهاء بعض المهام الروتينية اليومية في المدرسة، كحصر غياب الطلاب، والتوقيع على الكشف الخاص بذلك، والاطلاع على نشرات الإدارة وتعميماتها."},
  {name:"التدريس في وجود زائر", place:"مقعد الزائر آخر الفصل",
   d:"الارتباك الشديد حال دخول زائر (موجّه، أو مشرف، أو مدير) للملاحظة في الفصل، والوقوع في الإجابات البعيدة كل البعد عن الحقيقة."},
  {name:"توفير المواد والأجهزة التعليمية", place:"خزانة الفصل",
   d:"مشكلة تواجه المعلم عند بدء تدريسه في المدرسة في الحصول على المواد التعليمية والوسائل المختلفة والأجهزة التقنية اللازمة."}
];

const STORE = "novice-onepage-v1";
let own = {};
try { const r = localStorage.getItem(STORE); if (r) own = JSON.parse(r) || {}; } catch(e){}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(own)); } catch(e){} };

function inside(p){
  if (!p.tips) return "تعريف";
  if (p.causes) return "تعريف · أسباب · علاج";
  return "تعريف · " + (p.tips.length === 2 ? "نصيحتان" : "ثلاث نصائح");
}

const map = document.getElementById("map"), links = document.getElementById("links");
let current = -1;

function nodeHTML(i){
  const p = P[i];
  return `<button type="button" class="node" id="n${i}" style="--c:${COLORS[i]};--tc:${COLORS[i]}" aria-expanded="false" aria-controls="heart">
    <span class="nnum">${AR(i+1)}</span><span class="nname">${p.name}</span>
    <span class="nplace">في الفصل: ${p.place}</span><span class="ninside">${inside(p)}</span></button>`;
}
map.insertAdjacentHTML("beforeend",
  [0,1,2,3].map(nodeHTML).join("") +
  `<section class="heart idle" id="heart" aria-live="polite"></section>` +
  [4,5,6,7].map(nodeHTML).join(""));
const heart = document.getElementById("heart");
P.forEach((_, i) => document.getElementById("n"+i).addEventListener("click", () => show(current === i ? -1 : i)));

const ICON_X = '<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_N = '<svg viewBox="0 0 16 16"><path d="M10 3l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_P = '<svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

function body(i){
  const p = P[i];
  let h = `<div class="tree"><div class="v"></div><div class="box"><span class="tag">التعريف</span><p>${p.d}</p></div>`;
  if (p.causes){
    h += `<div class="v"></div><div class="split">
      <div class="col"><div class="hub">الأسباب</div><div class="v"></div><div class="box"><ol>${p.causes.map(c=>`<li>${c}</li>`).join("")}</ol></div></div>
      <div class="col"><div class="hub">${p.tt}</div><div class="v"></div><div class="stack">${p.tips.map(t=>`<div class="leaf"><b>${t[0]}</b>${t[1]}</div>`).join("")}</div></div></div>`;
  } else if (p.tips){
    h += `<div class="v"></div><div class="hub">${p.tt}</div><div class="v"></div>
      <div class="leaves n${p.tips.length}">${p.tips.map(t=>`<div class="leaf"><b>${t[0]}</b>${t[1]}</div>`).join("")}</div>`;
  } else {
  }
  return h + `</div>`;
}

function show(i){
  current = i;
  P.forEach((_, j) => { const n = document.getElementById("n"+j); n.classList.toggle("on", j === i); n.setAttribute("aria-expanded", j === i); });
  if (i < 0){
    heart.className = "heart idle"; heart.removeAttribute("style");
    heart.innerHTML = `<span class="small">مكتب المعلمة</span><span class="title">مشكلات المعلم المبتدئ</span><span class="small">ثماني مشكلات</span><span class="cta">اضغطي على أي مشكلة لتتفتح فروعها هنا</span>`;
  } else {
    const p = P[i];
    heart.className = "heart open"; heart.style.cssText = `--c:${COLORS[i]};--tc:${COLORS[i]}`;
    heart.innerHTML = `<div class="hhead"><span class="hnum">${AR(i+1)}</span>
      <div class="hname"><h2>${p.name}</h2><span>في الفصل: ${p.place}</span></div>
      <div class="hbtns"><button class="ib" type="button" id="prev" aria-label="المشكلة السابقة">${ICON_P}</button>
      <button class="ib" type="button" id="next" aria-label="المشكلة التالية">${ICON_N}</button>
      <button class="ib" type="button" id="close" aria-label="العودة إلى العنوان الرئيسي">${ICON_X}</button></div></div>${body(i)}`;
    document.getElementById("prev").onclick = () => show((i + 7) % 8);
    document.getElementById("next").onclick = () => show((i + 1) % 8);
    document.getElementById("close").onclick = () => { show(-1); document.getElementById("n"+i).focus(); };
    const sb = document.getElementById("saveOwn");
    if (sb) sb.onclick = () => {
      const v = document.getElementById("own").value.trim();
      own[i] = v; save();
      document.getElementById("okmsg").textContent = v ? "حُفظت نصيحتك على هذا الجهاز" : "اكتبي نصيحتك أولًا";
    };
    const r = heart.getBoundingClientRect();
    if (r.top < 0 || r.top > innerHeight * .6) heart.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  }
  draw();
}

function draw(){
  const m = map.getBoundingClientRect(), h = heart.getBoundingClientRect();
  links.setAttribute("viewBox", `0 0 ${m.width} ${m.height}`);
  links.classList.toggle("focus", current >= 0);
  const hx = h.left + h.width/2 - m.left;
  let s = "";
  P.forEach((_, i) => {
    const r = document.getElementById("n"+i).getBoundingClientRect();
    const x = r.left + r.width/2 - m.left, y = r.top + r.height/2 - m.top;
    const top = i < 4, ty = top ? h.top - m.top + 6 : h.bottom - m.top - 6;
    const tx = hx + (x - hx) * .35;
    s += `<line x1="${x}" y1="${y}" x2="${tx}" y2="${ty}" stroke="${COLORS[i]}" class="${i === current ? "on" : ""}"/>`;
  });
  links.innerHTML = s;
}
show(-1);
new ResizeObserver(draw).observe(map);
addEventListener("resize", draw);
document.fonts && document.fonts.ready.then(draw);
</script>

</body>
</html>
